# Обучение ботов Geminium на суррогатной модели (GDD 8.2, TODO 3.5).
# PPO, одна политика на три архетипа: каждая компания играет против копий той же политики (self-play),
# архетип виден в наблюдениях и ограничивает действия маской. Шаг = игровой месяц, эпизод = 36 месяцев.
# Запуск — Training/README.md.
behaviors:
  GeminiumBot:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false        # наблюдения уже приведены к −1…+1 (BotObservation)
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.97
        strength: 1.0
    max_steps: 500000
    time_horizon: 36
    summary_freq: 20000
    keep_checkpoints: 3
    checkpoint_interval: 100000
engine_settings:
  no_graphics: true
  time_scale: 100
